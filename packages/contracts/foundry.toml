[profile.default]
src = 'src'
test = 'test'
evm_version = 'paris'
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./test/vectors" }, { access = "read", path = "./test/fixtures" }, { access = "read", path = "../../apps/web/src/data" }]

[invariant]
runs = 64
depth = 40
fail_on_revert = false
